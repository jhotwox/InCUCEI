version: "3.1"

intents:
  - request_academic_material
  - greet
  - goodbye
  # - thank_you

slots:
  # material_type:
  #   type: text
  #   mappings:
  #     - type: from_llm
  # material_name:
  #   type: text
  #   mappings:
  #     - type: from_llm
  topic:
    type: text
    mappings:
      - type: from_llm
  confirm_human_contact:
    type: bool
    mappings:
      - type: from_llm
        # allow_nlu_correction: true

responses:
  utter_ask_topic:
    - text: "Cuál es la materia en la que necesitas material?"
      metadata:
        rephrase: True

  utter_material_found:
    - text: "Aquí encontraras el material que necesitas: {material_link}"
      metadata:
        rephrase: True

  utter_material_not_found:
    - text: "No se encontró el material solicitado."
      metadata:
        rephrase: True

  utter_ask_confirm_human_contact:
    - text: "¿Quieres que te proporcione información de contacto para más ayuda?"
      metadata:
        rephrase: True

  utter_human_contact:
    - text: "Puedes contactar este correo: test@academicos.udg.mx o este teléfono: +52 33 1234 5678"
      metadata:
        rephrase: True
        # rephrase_prompt: |
        #   The following is a conversation in spanish with an AI assistant built with Rasa.
        #   The assistant can help the user with academic materials.
        #   The assistant is helpful, creative, clever, and very friendly.
        #   The user has just requested human contact information.
        #   The assistant should respond in a way that is polite and continues to offer help.
        #   Context / previous conversation with the user:
        #   {{history}}
        #   {{current_input}}
        #   Suggested AI Response:

  utter_human_contact_canceled:
    - text: "Entendido, no te proporcionaré información de contacto. Hay algo más en lo que pueda ayudarte?"
      metadata:
        rephrase: True
  
  utter_greet:
    - text: "Hola! Como te puedo asistir el dia de hoy?"
      metadata:
        rephrase: True

  utter_goodbye:
    - text: "Hasta luego! si necesitas asistencia en el futuro, Sientete libre de preguntar."
      metadata:
        rephrase: True

  # utter_thank_you:
  #   - text: "¡Con gusto! 😊"

  utter_free_chitchat_response:
    - text: "placeholder"
      metadata:
        rephrase: True
        rephrase_prompt: |
          The following is a conversation in spanish with an AI assistant built with Rasa.
          The assistant can help the user with academic materials.
          The assistant is helpful, creative, clever, and very friendly.
          The user is making small talk, and the assistant should respond, keeping things light.
          Context / previous conversation with the user:
          {{history}}
          {{current_input}}
          Suggested AI Response:


actions:
  - action_fetch_academic_materials
  - action_human_contact