version: "3.1"

intents:
  - request_academic_material
  - request_coordination_info
  - request_registration_process
  - greet
  - goodbye
  # - thank_you

entities:
  - topic
  - career

slots:
  topic:
    type: text
    mappings:
      - type: from_llm
  career:
    type: text
    mappings:
      - type: from_llm
  confirm_human_contact:
    type: bool
    mappings:
      - type: from_llm

responses:
  utter_ask_topic:
    - text: "¿Cuál es la materia en la que necesitas material?"
      metadata:
        rephrase: True

  utter_material_found:
    - text: "Aquí encontrarás el material que necesitas: {material_link}"
      metadata:
        rephrase: True

  utter_material_not_found:
    - text: "No se encontró el material solicitado."
      metadata:
        rephrase: True

  utter_coordination_info:
    - text: "Información de la coordinación de {career}: {coordination_data}"
      metadata:
        rephrase: True

  utter_registration_process:
    - text: |
        Estos son los pasos para el registro de materias en CUCEI:
        1. Ingresa a [SIIAU](http://www.siiau.udg.mx).
        2. Selecciona 'Registro de materias'.
        3. Ingresa tu código de estudiante y NIP.
        4. Selecciona tus materias disponibles.
        5. Confirma tu horario y guarda comprobante.
      metadata:
        rephrase: True

  utter_ask_confirm_human_contact:
    - text: "¿Quieres que te proporcione información de contacto para más ayuda?"
      metadata:
        rephrase: True

  utter_human_contact:
    - text: "Puedes contactar este correo: test@academicos.udg.mx o este teléfono: +52 33 1234 5678"
      metadata:
        rephrase: True

  utter_human_contact_canceled:
    - text: "Entendido, no te proporcionaré información de contacto. ¿Hay algo más en lo que pueda ayudarte?"
      metadata:
        rephrase: True
  
  utter_greet:
    - text: "¡Hola! ¿Cómo te puedo asistir el día de hoy?"
      metadata:
        rephrase: True

  utter_goodbye:
    - text: "¡Hasta luego! Si necesitas asistencia en el futuro, siéntete libre de preguntar."
      metadata:
        rephrase: True

  utter_free_chitchat_response:
    - text: "placeholder"
      metadata:
        rephrase: True
        rephrase_prompt: |
          The following is a conversation in Spanish with an AI assistant built with Rasa.
          The assistant can help the user with academic materials, coordinations, and UDG processes.
          The assistant is helpful, creative, clever, and very friendly.
          The user is making small talk, and the assistant should respond, keeping things light.
          Context / previous conversation with the user:
          {{history}}
          {{current_input}}
          Suggested AI Response:

actions:
  - action_fetch_academic_materials
  - action_fetch_coordination_info
  - action_human_contact
