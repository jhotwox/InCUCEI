version: "3.1"

intents:
  - request_subject_material
  - request_subject_study_plan
  - request_subjects
  - request_location_map
  - request_curriculum
  - greet
  - goodbye
  - request_human_contact
  # - thank_you

entities:
  - subject
  - location
  - career_code

slots:
  topic:
    type: text
    mappings:
      - type: from_llm

  career_code:
    type: text
    mappings:
      - type: from_llm
  confirm_human_contact:
    type: bool
    mappings:
      - type: from_llm
        # allow_nlu_correction: true

  location_name:
    type: text
    mappings:
      - type: from_llm

responses:
  utter_ask_topic:
    - text: "Cuál es la materia en la que necesitas material?"
      metadata:
        rephrase: True

  utter_ask_career_code:
    - text: "¿Cuál es el código de tu carrera? (por ejemplo: INNI, INEA, LQFB, INFO, ILOT, LILT)"
      metadata:
        rephrase: True

  utter_invalid_career_code:
    - text: "No reconozco ese código de carrera. Intenta con uno como: INNI, INEA, LQFB, INFO, ILOT, LILT."
      metadata:
        rephrase: True

  utter_ask_location_name:
    - text: "¿Qué lugar necesitas ver en el mapa del CUCEI? (por ejemplo: Módulo A, Biblioteca, Baño)"
      metadata:
        rephrase: True

  utter_ask_location:
    - text: "¿Qué lugar necesitas ver en el mapa del CUCEI? (por ejemplo: Módulo A, Biblioteca, Baño)"
      metadata:
        rephrase: True

  utter_material_not_found:
    - text: "No se encontró el material solicitado."
      metadata:
        rephrase: True

  utter_study_plan_not_found:
    - text: "No se encontró el plan de estudios solicitado."
      metadata:
        rephrase: True

  utter_curriculum_not_found:
    - text: "No encontré la malla curricular para ese código de carrera. ¿Puedes verificarlo?"
      metadata:
        rephrase: True

  utter_ask_confirm_human_contact:
    - text: "¿Quieres que te proporcione información de contacto para más ayuda?"
      metadata:
        rephrase: True

  utter_human_contact:
    - text: "Contactos CUCEI:\n- Servicios escolares: servicios.escolares@cucei.udg.mx\n- Coordinación Informática: coordinacion.di@cucei.udg.mx\n- Tel: +52 33 1378-5900\n- Web: https://www.cucei.udg.mx/"
      metadata:
        rephrase: True
        # rephrase_prompt: |
        #   The following is a conversation in spanish with an AI assistant built with Rasa.
        #   The assistant can help the user with academic materials.
        #   The assistant is helpful, creative, clever, and very friendly.
        #   The user has just requested human contact information.
        #   The assistant should respond in a way that is polite and continues to offer help.
        #   Context / previous conversation with the user:
        #   {{history}}
        #   {{current_input}}
        #   Suggested AI Response:

  utter_human_contact_canceled:
    - text: "Entendido, no te proporcionaré información de contacto. Hay algo más en lo que pueda ayudarte?"
      metadata:
        rephrase: True
  
  utter_greet:
    - text: "Hola! Como te puedo asistir el dia de hoy?"
      metadata:
        rephrase: True

  utter_goodbye:
    - text: "Hasta luego! si necesitas asistencia en el futuro, Sientete libre de preguntar."
      metadata:
        rephrase: True

  # utter_thank_you:
  #   - text: "¡Con gusto! 😊"

  utter_free_chitchat_response:
    - text: "placeholder"
      metadata:
        rephrase: True
        rephrase_prompt: |
          The following is a conversation in spanish with an AI assistant built with Rasa.
          The assistant can help the user with academic materials.
          The assistant is helpful, creative, clever, and very friendly.
          The user is making small talk, and the assistant should respond, keeping things light.
          Context / previous conversation with the user:
          {{history}}
          {{current_input}}
          Suggested AI Response:


actions:
  - action_get_subject_material
  - action_get_subject_study_plan
  - action_get_curriculum
  - action_get_subjects
  - action_show_location_on_map
  - action_fetch_academic_materials
  - action_human_contact