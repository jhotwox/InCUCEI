version: "3.1"

intents:
  - request_subject_material
  - request_subject_study_plan
  - request_location_map
  - request_curriculum
  - greet
  - goodbye
  - request_human_contact
  - inform_career
  - request_capabilities
  # - thank_you

entities:
  - subject
  - location
  - career_code

slots:
  topic:
    type: text
    mappings:
      - type: from_llm

  career_code:
    type: text
    mappings:
      - type: from_llm
  
  user_name:
    type: text
    mappings:
      - type: custom

  first_name:
    type: text
    mappings:
      - type: custom

  confirm_human_contact:
    type: bool
    mappings:
      - type: from_llm
        # allow_nlu_correction: true

  location_name:
    type: text
    mappings:
      - type: from_llm

responses:
  utter_ask_topic:
    - text: "Cuál es la materia en la que necesitas material?"
      metadata:
        rephrase: True

  utter_ask_career_code:
    - text: "¿Cuál es el código de tu carrera? (por ejemplo: INNI, INEA, LQFB, INFO, ILOT, LILT)"
      metadata:
        rephrase: True

  utter_invalid_career_code:
    - text: "No reconozco ese código de carrera. Intenta con uno como: INNI, INEA, LQFB, INFO, ILOT, LILT."
      metadata:
        rephrase: True

  utter_ask_location_name:
    - text: "¿Qué lugar necesitas ver en el mapa del CUCEI? (por ejemplo: Módulo A, Biblioteca, Baño)"
      metadata:
        rephrase: True

  utter_ask_location:
    - text: "¿Qué lugar necesitas ver en el mapa del CUCEI? (por ejemplo: Módulo A, Biblioteca, Baño)"
      metadata:
        rephrase: True

  utter_material_not_found:
    - text: "No se encontró el material solicitado."
      metadata:
        rephrase: True

  utter_study_plan_not_found:
    - text: "No se encontró el plan de estudios solicitado."
      metadata:
        rephrase: True

  utter_curriculum_not_found:
    - text: "No encontré la malla curricular para ese código de carrera. ¿Puedes verificarlo?"
      metadata:
        rephrase: True

  utter_ask_confirm_human_contact:
    - text: "¿Quieres que te proporcione información de contacto para más ayuda?"
      metadata:
        rephrase: True

  utter_human_contact:
    - text: "Contactos CUCEI:\n- Servicios escolares: servicios.escolares@cucei.udg.mx\n- Coordinación Informática: coordinacion.di@cucei.udg.mx\n- Tel: +52 33 1378-5900\n- Web: https://www.cucei.udg.mx/"
      metadata:
        rephrase: True
        rephrase_prompt: |
          Eres un asistente amable para la comunidad de CUCEI. 
          CONOCIMIENTO REAL (NO INVENTES):
          - Teléfono: [+523313785900](tel:+523313785900)
          - Control Escolar: [servicios.escolares@cucei.udg.mx](mailto:servicios.escolares@cucei.udg.mx) (Módulo A)
          - Sitio Web: [www.cucei.udg.mx](https://www.cucei.udg.mx)
          
          Información del usuario:
          - Nombre: {{slots.first_name}}
          - Carrera: {{slots.career_code}}
          Contexto:
          {{history}}
          Entrada actual: {{current_input}}
          Respuesta sugerida:

  utter_human_contact_canceled:
    - text: "Entendido, no te proporcionaré información de contacto. Hay algo más en lo que pueda ayudarte?"
      metadata:
        rephrase: True

  utter_confirm_career:
    - text: "¡Entendido! He registrado que eres de la carrera {career_code}. ¿En qué más puedo ayudarte?"
      metadata:
        rephrase: True

  utter_capabilities:
    - text: "Soy el asistente inteligente de InCUCEI y puedo ayudarte con:\n- 📚 **Material de estudio**: Recursos de tus materias.\n- 📋 **Planes de estudio**: Temarios oficiales.\n- 🗺️ **Mapa interactivo**: Ubicaciones en CUCEI.\n- 🎓 **Malla curricular**: El PDF de tu carrera.\n- 📞 **Información de contacto**: Datos oficiales."
      metadata:
        rephrase: True
  
  utter_greet:
    - text: "¡Hola! ¿Cómo te puedo asistir el día de hoy?"
      metadata:
        rephrase: True
        rephrase_prompt: |
          Eres un asistente amable para la comunidad de CUCEI. 
          Saluda al usuario.
          Información del usuario:
          - Nombre: {{slots.first_name}}
          Contexto:
          {{history}}
          Entrada actual: {{current_input}}
          Respuesta sugerida:

  utter_goodbye:
    - text: "Hasta luego! si necesitas asistencia en el futuro, Sientete libre de preguntar."
      metadata:
        rephrase: True
        rephrase_prompt: |
          Eres un asistente amable. Despídete del usuario.
          Contexto:
          {{history}}
          Entrada actual: {{current_input}}
          Respuesta sugerida:

  # utter_thank_you:
  #   - text: "¡Con gusto! 😊"

  utter_free_chitchat_response:
    - text: "placeholder"
      metadata:
        rephrase: True
        rephrase_prompt: |
          Eres el asistente inteligente de InCUCEI. Ayudas con temas académicos.
          
          Si preguntan quién eres: eres el asistente de InCUCEI.
          Si preguntan quiénes son o su carrera, USA LOS SLOTS:
          - Nombre: {{slots.user_name}}
          - Carrera: {{slots.career_code}}
          
          DICCIONARIO: [INNI: Informática, INFO: Computación, ILOT: Logística, INRO: Robótica, INCE: Comunicaciones, INEA: Electromovilidad, INBI: Biomédica, INME: Mecánica, INDU: Industrial, ITOG: Topografía, IGFO: Fotónica, LQFB: QFB, LQUI: Química, LIMA: Matemáticas].
          
          Responde en español y usa Markdown.
          Contexto:
          {{history}}
          Entrada actual: {{current_input}}
          Respuesta sugerida:


actions:
  - action_get_subject_material
  - action_get_subject_study_plan
  - action_get_curriculum
  - action_show_location_on_map
  - action_fetch_academic_materials
  - action_human_contact
