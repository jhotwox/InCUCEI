version: "3.1"

flows:
  academic_assistance:
    description: Ayudar al usuario a encontrar materiales académicos.
    steps:
      - collect: topic
        description: Materia o tema del material solicitado.
      - action: action_fetch_academic_materials
      - action: utter_material_found
      - action: utter_material_not_found

  coordination_info:
    description: Dar información sobre la coordinación de una carrera.
    steps:
      - collect: career
        description: Carrera de la cual se quiere la coordinación.
      - action: action_fetch_coordination_info
      - action: utter_coordination_info

  registration_process:
    description: Explicar el proceso de registro de materias en CUCEI.
    steps:
      - action: utter_registration_process

  human_contact:
    description: Proporcionar información de contacto si el usuario lo solicita.
    steps:
      - collect: confirm_human_contact
        next:
          - if: slots.confirm_human_contact
            then:
              - action: utter_human_contact
              - next: END
          - else:
              - action: utter_human_contact_canceled
              - next: END

  greet:
    description: Manejar saludos.
    steps:
      - action: utter_greet

  goodbye:
    description: Manejar despedidas.
    steps:
      - action: utter_goodbye

  pattern_chitchat:
    description: Manejar conversaciones fuera de tema.
    steps:
      - action: utter_free_chitchat_response
