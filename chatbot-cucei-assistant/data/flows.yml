flows:
  subject_material:
    description: Provide study material for a CUCEI subject.
    nlu_trigger:
      - intent: request_subject_material
    steps:
      - collect: topic
        description: The subject name requested by the user.
      - collect: career_code
        description: The user's career code (e.g., INNI, INFO, LQFB).
      - action: action_get_subject_material

  subject_study_plan:
    description: Provide study plan for a CUCEI subject.
    nlu_trigger:
      - intent: request_subject_study_plan
    steps:
      - collect: topic
        description: The subject name requested by the user.
      - collect: career_code
        description: The user's career code (e.g., INNI, INFO, LQFB).
      - action: action_get_subject_study_plan

  curriculum:
    description: Provide the curriculum (malla) PDF for a CUCEI career code.
    nlu_trigger:
      - intent: request_curriculum
    steps:
      - collect: career_code
        description: The user's career code (e.g., INNI, INFO, LQFB).
      - action: action_get_curriculum

  show_location:
    description: Show a CUCEI location on the map.
    nlu_trigger:
      - intent: request_location_map
    steps:
      - collect: location_name
        description: The location name requested by the user.
      - action: action_show_location_on_map

  human_contact:
    description: Seamlessly send contact information when necessary.
    nlu_trigger:
      - intent: request_human_contact
    steps:
      - action: utter_human_contact
        next: END
  
  greet:
    description: Handle user greetings.
    nlu_trigger:
      - intent: greet
    steps:
      # - action: greet
      - action: utter_greet

  goodbye:
    description: Handle user farewells.
    nlu_trigger:
      - intent: goodbye
    steps:
      # - intent: goodbye
      - action: utter_goodbye

  set_career:
    description: Update the user's career code.
    nlu_trigger:
      - intent: inform_career
    steps:
      - collect: career_code
        description: The user's career code.
      - action: utter_confirm_career

  bot_capabilities:
    description: Describe what the bot can do.
    nlu_trigger:
      - intent: request_capabilities
    steps:
      - action: utter_capabilities

  # thank_you:
  #   description: Handle user expressions of gratitude.
  #   steps:
  #     - intent: thank_you
  #     - action: utter_thank_you

  pattern_chitchat:
    description: Handle off-topic interactions without disrupting the main conversation.
    name: pattern chitchat
    steps:
      - action: utter_free_chitchat_response