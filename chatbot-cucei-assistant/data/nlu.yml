version: "3.1"

nlu:
  - intent: greet
    examples: |
      - hola
      - buenos días
      - qué tal
      - como estás?
      - buenas tardes
      - buenas noches
      - noches
      - dias
      - tardes
      - hey
      - holaa
      - holis
      - qué hubo
      - qué onda
      - qué pasa
      - qué pasa calabaza
      - buenas
      - hi

  - intent: goodbye
    examples: |
      - adiós
      - hasta luego
      - nos vemos
      - te veo luego
      - chao
      - chau
      - me voy
      - hasta la próxima
      - camara
      - nos estamos viendo
      - bye

  - intent: request_subject_material
    examples: |
      - necesito material de [algoritmia](subject)
      - pásame apuntes de [bases de datos](subject)
      - ¿tienes material de [cálculo diferencial](subject)?
      - quiero el material de [Ingenieria de Software I](subject)
      - dame el material de [Administracion de Redes](subject)
      - necesito el material de [BD](subject)
      - necesito material de [Programación](subject) de [INNI](career_code)
      - pásame el material de [Bases de Datos](subject) para [LQFB](career_code)
      - dame material de [Algoritmia](subject) en [INFO](career_code)

  - intent: request_subject_study_plan
    examples: |
      - quiero el plan de estudios de [Algoritmia](subject)
      - pásame el plan de [Bases de Datos](subject)
      - ¿me das el plan de [Cálculo Diferencial](subject)?
      - necesito el plan de [Ingenieria de Software I](subject)
      - quiero el plan de [Programación](subject) de [INNI](career_code)
      - pásame el plan de [Bases de Datos](subject) para [INFO](career_code)

  - intent: request_location_map
    examples: |
      - ¿En dónde está la [Biblioteca](location)?
      - ¿En dónde está el [baño del modulo Z](location)?
      - ¿dónde está [Biblioteca](location)?
      - muéstrame [Modulo A](location)
      - llévame al [Modulo B](location)
      - necesito encontrar el [Baño Modulo U](location)
      - quiero ver [Lonaria](location) en el mapa

  - intent: request_curriculum
    examples: |
      - quiero la malla de [INNI](career_code)
      - pásame la malla curricular de [LQFB](career_code)
      - necesito la malla de [INFO](career_code)
      - dame la malla de [ingenieria informatica](career_code)

  - intent: request_human_contact
    examples: |
      - necesito un contacto
      - me puedes dar un correo o teléfono
      - quiero hablar con alguien
      - dame información de contacto
      - dame el contacto de [control escolar](contact_name)
      - correo de [rectoría](contact_name)
      - telefono de [servicios escolares](contact_name)
      - busco a [coordinacion de informatica](contact_name)
      - contacto de [biblioteca](contact_name)
      - pasame el telefono de la [enfermeria](contact_name)
      - quiero hablar con el coordinador de [informatica](contact_name)

  - intent: inform_career
    examples: |
      - soy de [INNI](career_code)
      - mi codigo de carrera es [INNI](career_code)
      - este es mi codigo de carrera [INNI](career_code)
      - mi carrera es [INFO](career_code)
      - estudio [LQFB](career_code)
      - estudio la carrera de [LQFB](career_code)
      - cámbiame a [INEA](career_code)
      - recuérdame como [ILOT](career_code)
      - soy de la carrera [INNI](career_code)

  - intent: request_capabilities
    examples: |
      - que puedes hacer
      - que sabes hacer
      - dime tus funciones
      - en que me puedes ayudar
      - para que sirves
      - resumen de que puedes hacer
      - que ayuda ofreces
    